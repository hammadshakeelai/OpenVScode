<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="OpenVScode Mobile IDE - a full VS Code IDE that runs on your phone, with Python 3, C++ GCC 12 and Jupyter">
  <title>OpenVScode Mobile IDE</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0d0d11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.72">
      <stop offset="0%" stop-color="#007acc" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#007acc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0098ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0098ff"/>
      <stop offset="100%" stop-color="#0098ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="760" height="280" fill="url(#bg)"/>
  <rect width="760" height="280" fill="url(#glow)"/>

  <!-- Decorative code texture, kept faint: reads as pattern, never as content -->
  <g fill="#ffffff" opacity="0.05">
    <rect x="40"  y="60"  width="66" height="9" rx="4.5"/>
    <rect x="40"  y="82"  width="42" height="9" rx="4.5"/>
    <rect x="52"  y="104" width="58" height="9" rx="4.5"/>
    <rect x="52"  y="126" width="34" height="9" rx="4.5"/>
    <rect x="40"  y="148" width="50" height="9" rx="4.5"/>
    <rect x="654" y="60"  width="66" height="9" rx="4.5"/>
    <rect x="678" y="82"  width="42" height="9" rx="4.5"/>
    <rect x="662" y="104" width="58" height="9" rx="4.5"/>
    <rect x="686" y="126" width="34" height="9" rx="4.5"/>
    <rect x="670" y="148" width="50" height="9" rx="4.5"/>
  </g>

  <!-- Launcher glyph -->
  <g transform="translate(342,28)">
    <rect width="76" height="76" rx="17" fill="#007acc"/>
    <g transform="scale(0.7037)">
      <path fill="#ffffff" d="M75,25 L50,45 L35,32 L25,38 L42,54 L25,70 L35,76 L50,63 L75,83 L83,78 L83,30 Z"/>
      <path fill="#005a9e" d="M50,45 L75,25 L83,30 L83,48 Z"/>
      <path fill="#004c87" d="M50,63 L75,83 L83,78 L83,60 Z"/>
    </g>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="380" y="154" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.5">OpenVScode Mobile IDE</text>
    <rect x="290" y="170" width="180" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="380" y="204" font-size="23" fill="#a4aeb8">A full VS Code IDE that runs on your phone.</text>

    <g font-size="23" font-weight="600">
      <rect x="127" y="224" width="140" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#3d434b"/>
      <text x="197" y="248" fill="#ffd050">Python 3</text>

      <rect x="281" y="224" width="210" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#3d434b"/>
      <text x="386" y="248" fill="#ff7b72">C++ · GCC 12</text>

      <rect x="505" y="224" width="128" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#3d434b"/>
      <text x="569" y="248" fill="#f0883e">Jupyter</text>
    </g>
  </g>
</svg>

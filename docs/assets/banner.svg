<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="OpenVScode Mobile IDE - a full VS Code environment that runs on your phone, with Python 3, C++ Clang and Jupyter kernels">
  <title>OpenVScode Mobile IDE</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1b20"/>
      <stop offset="100%" stop-color="#0e0e12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#007acc" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#007acc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0098ff"/>
      <stop offset="100%" stop-color="#0098ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="918" y="52" width="204" height="276" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>

  <!-- Logo mark: the launcher icon glyph -->
  <g transform="translate(72,92)">
    <rect width="92" height="92" rx="20" fill="#007acc"/>
    <g transform="translate(9.2,9.2) scale(0.685)">
      <path fill="#ffffff" d="M75,25 L50,45 L35,32 L25,38 L42,54 L25,70 L35,76 L50,63 L75,83 L83,78 L83,30 Z"/>
      <path fill="#005a9e" d="M50,45 L75,25 L83,30 L83,48 Z"/>
      <path fill="#004c87" d="M50,63 L75,83 L83,78 L83,60 Z"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="196" y="140" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.5">OpenVScode Mobile IDE</text>
    <rect x="197" y="156" width="300" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="196" y="196" font-size="21" fill="#9aa4ae">A full VS Code environment that runs on your phone.</text>

    <!-- Capability pills -->
    <g font-size="15" font-weight="600" text-anchor="middle">
      <rect x="196" y="224" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#3a4048"/>
      <text x="262" y="248" fill="#ffd050">Python 3</text>

      <rect x="340" y="224" width="176" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#3a4048"/>
      <text x="428" y="248" fill="#ff7b72">C++ · Clang 20</text>

      <rect x="528" y="224" width="180" height="38" rx="19" fill="#ffffff" fill-opacity="0.05" stroke="#3a4048"/>
      <text x="618" y="248" fill="#f0883e">Jupyter Kernels</text>
    </g>

    <text x="196" y="306" font-size="15" fill="#6e7681">Termux install · native Android APK · offline toolchain</text>
  </g>

  <!-- Phone mock -->
  <g>
    <rect x="906" y="40" width="228" height="300" rx="28" fill="#26262b" stroke="#3a3a42" stroke-width="2"/>
    <rect x="918" y="52" width="204" height="276" rx="16" fill="#1e1e1e"/>
    <g clip-path="url(#screen)">
      <!-- title bar -->
      <rect x="918" y="52" width="204" height="26" fill="#252526"/>
      <circle cx="932" cy="65" r="4" fill="#ff5f56"/>
      <circle cx="946" cy="65" r="4" fill="#ffbd2e"/>
      <circle cx="960" cy="65" r="4" fill="#27c93f"/>
      <rect x="978" y="61" width="52" height="8" rx="4" fill="#3c3c44"/>

      <!-- code lines -->
      <g>
        <rect x="932" y="92"  width="34" height="7" rx="3.5" fill="#c586c0"/>
        <rect x="972" y="92"  width="52" height="7" rx="3.5" fill="#9cdcfe"/>

        <rect x="932" y="110" width="24" height="7" rx="3.5" fill="#569cd6"/>
        <rect x="962" y="110" width="44" height="7" rx="3.5" fill="#dcdcaa"/>
        <rect x="1012" y="110" width="18" height="7" rx="3.5" fill="#4a4a52"/>

        <rect x="944" y="128" width="30" height="7" rx="3.5" fill="#569cd6"/>
        <rect x="980" y="128" width="66" height="7" rx="3.5" fill="#ce9178"/>

        <rect x="944" y="146" width="76" height="7" rx="3.5" fill="#6a9955"/>

        <rect x="944" y="164" width="26" height="7" rx="3.5" fill="#4ec9b0"/>
        <rect x="976" y="164" width="40" height="7" rx="3.5" fill="#9cdcfe"/>
        <rect x="1022" y="164" width="20" height="7" rx="3.5" fill="#b5cea8"/>

        <rect x="932" y="182" width="46" height="7" rx="3.5" fill="#4a4a52"/>

        <!-- notebook output cell -->
        <rect x="928" y="202" width="184" height="46" rx="6" fill="#252526" stroke="#333"/>
        <rect x="938" y="214" width="14" height="7" rx="3.5" fill="#f0883e"/>
        <rect x="958" y="214" width="88" height="7" rx="3.5" fill="#8b8b93"/>
        <rect x="938" y="230" width="120" height="7" rx="3.5" fill="#27c93f"/>
      </g>

      <!-- touch key bar -->
      <rect x="918" y="286" width="204" height="42" fill="#252526"/>
      <g fill="#333338">
        <rect x="927" y="295" width="30" height="24" rx="5"/>
        <rect x="962" y="295" width="30" height="24" rx="5"/>
        <rect x="997" y="295" width="30" height="24" rx="5"/>
        <rect x="1032" y="295" width="30" height="24" rx="5"/>
        <rect x="1067" y="295" width="46" height="24" rx="5"/>
      </g>
      <g fill="#cccccc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
        <text x="942" y="311">ESC</text>
        <text x="977" y="311">TAB</text>
        <text x="1012" y="311">{ }</text>
        <text x="1047" y="311">( )</text>
        <text x="1090" y="311">CTRL</text>
      </g>
    </g>
  </g>
</svg>

plugins {
    id("com.android.application")
}

android {
    namespace = "com.openvscode.mobile"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.openvscode.mobile"
        minSdk = 26
        // Deliberately 28, not the platform maximum. Apps targeting <= 28 run in
        // the untrusted_app_27 SELinux domain, which still permits execute on
        // app_data_file — measured alive on API 36. That is the only path to
        // running a downloaded glibc rootfs, since Android's bionic linker
        // cannot load glibc binaries however they are invoked. See
        // docs/SELF_BOOTSTRAP_PLAN.md §7. Forecloses Play Store distribution,
        // which the approach already ruled out.
        targetSdk = 28
        versionCode = 6
        versionName = "1.0.5"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Only the ABIs we actually target: real phones are arm64, the test
        // emulator is x86_64. Building the others just inflates the APK.
        ndk {
            abiFilters += ["arm64-v8a", "x86_64"]
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    // The shim must exist as a real file in the native library directory, not
    // be loaded straight from the APK — that directory is the only location an
    // app is permitted to execute from.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
        debug {
            applicationIdSuffix = ".debug"
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.11.0")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation("androidx.webkit:webkit:1.10.0")

    // Rootfs extraction. commons-compress reads the tar (symlinks, long names,
    // PAX headers — a Debian rootfs has all three); tukaani provides the xz
    // decoder, which the JDK does not ship. Together ~1.1 MB of APK.
    implementation("org.apache.commons:commons-compress:1.27.1")
    implementation("org.tukaani:xz:1.10")
    testImplementation("junit:junit:4.13.2")
}

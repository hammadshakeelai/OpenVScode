plugins {
    id("com.android.application")
}

android {
    namespace = "com.openvscode.mobile"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.openvscode.mobile"
        minSdk = 26
        // Termux owns the runtime. The shell no longer needs a legacy target
        // or execution of downloaded binaries from its private directory.
        targetSdk = 35
        versionCode = 9
        versionName = "1.1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Only the ABIs we actually target: real phones are arm64, the test
        // emulator is x86_64. Building the others just inflates the APK.
        ndk {
            abiFilters += ["arm64-v8a", "x86_64"]
        }
    }

    // The shim must exist as a real file in the native library directory, not
    // be loaded straight from the APK — that directory is the only location an
    // app is permitted to execute from.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
        debug {
            applicationIdSuffix = ".debug"
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/runtimeAssets"))
    buildFeatures { buildConfig = true }
}

// Ship the reviewed installer with the APK. Setup never depends on whichever
// code happens to be at the tip of a remote branch on installation day.
tasks.register("bundleRuntime", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "install.sh", "setup.sh", "start.sh"
        include "scripts/**", "config/**", "examples/**"
        exclude "**/__pycache__/**", "**/*.pyc", "scripts/test_*.py"
        filter(org.apache.tools.ant.filters.FixCrLfFilter, eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance("lf"))
    }
    into(layout.buildDirectory.dir("generated/runtimeAssets/runtime"))
}
tasks.named("preBuild").configure { dependsOn("bundleRuntime") }

dependencies {
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.google.android.material:material:1.11.0")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation("androidx.webkit:webkit:1.10.0")

    // Rootfs extraction. commons-compress reads the tar (symlinks, long names,
    // PAX headers — a Debian rootfs has all three); tukaani provides the xz
    // decoder, which the JDK does not ship. Together ~1.1 MB of APK.
    implementation("org.apache.commons:commons-compress:1.27.1")
    implementation("org.tukaani:xz:1.10")
    testImplementation("junit:junit:4.13.2")
}
